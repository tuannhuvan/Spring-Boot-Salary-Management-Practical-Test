<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Management System</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome CSS CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-card {
            border: none;
            border-radius: 8px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            margin-bottom: 2rem;
        }
        .card-header-custom {
            background-color: #ffffff;
            border-bottom: 2px solid #e9ecef;
            font-weight: 600;
            padding: 1rem 1.25rem;
        }
        .btn-warning-custom {
            background-color: #ff9800;
            border-color: #ff9800;
            color: white;
        }
        .btn-warning-custom:hover {
            background-color: #e68a00;
            color: white;
        }
    </style>
</head>
<body>

<div class="container py-4">
    <!-- Header Title -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold mb-0">
            <i class="fa-solid me-2"></i>Salary Management System
        </h2>
        <span class="badge bg-secondary">IASF Practical Examination</span>
    </div>

    <!-- Alert Box Area -->
    <div id="alertArea">
        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="fa-solid fa-circle-check me-2"></i>
            <span th:text="${successMessage}">User created successfully</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-2"></i>
            <span th:text="${errorMessage}">Error while creating User</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <!-- Block 1: User Form (Create / Edit) -->
    <div class="card main-card">
        <div class="card-header card-header-custom">
            <h4 class="mb-0 text-secondary" id="formTitle" th:text="${user.id != null ? 'Edit User' : 'User'}">User</h4>
        </div>
        <div class="card-body p-4">
            <form id="userForm" th:action="${user.id != null ? '/users/update' : '/users/save'}" th:object="${user}" method="post">
                <input type="hidden" id="userId" th:field="*{id}" />

                <div class="row g-3">
                    <!-- Name Field -->
                    <div class="col-md-4">
                        <label for="name" class="form-label fw-bold">Name <span class="text-danger">*</span></label>
                        <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Enter your name" required />
                    </div>

                    <!-- Age Field -->
                    <div class="col-md-4">
                        <label for="age" class="form-label fw-bold">Age <span class="text-danger">*</span></label>
                        <input type="number" id="age" th:field="*{age}" class="form-control" placeholder="Enter your Age." required min="1" />
                    </div>

                    <!-- Salary Field -->
                    <div class="col-md-4">
                        <label for="salary" class="form-label fw-bold">Salary <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" id="salary" th:field="*{salary}" class="form-control" placeholder="Enter your Salary." required min="0.01" />
                    </div>
                </div>

                <!-- Form Action Buttons -->
                <div class="d-flex justify-content-end gap-2 mt-4">
                    <button type="submit" id="btnSubmit" class="btn btn-primary px-4 fw-bold" th:text="${user.id != null ? 'Update' : 'Add'}">
                        Add
                    </button>
                    <button type="button" id="btnReset" class="btn btn-warning-custom px-4 fw-bold">
                        Reset Form
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Block 2: List of Users & Search -->
    <div class="card main-card">
        <div class="card-header card-header-custom d-flex justify-content-between align-items-center">
            <h4 class="mb-0 text-secondary">List of Users</h4>
            
            <!-- Search Form -->
            <form th:action="@{/}" method="get" class="d-flex gap-2" style="max-width: 350px;">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control form-control-sm" placeholder="Search by name..." />
                <button type="submit" class="btn btn-info btn-sm text-white fw-bold px-3">
                    <i class="fa-solid fa-magnifying-glass me-1"></i>Search
                </button>
                <a th:if="${keyword != null and keyword != ''}" th:href="@{/}" class="btn btn-outline-secondary btn-sm" title="Clear Search">
                    <i class="fa-solid fa-xmark"></i>
                </a>
            </form>
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col" class="ps-4" style="width: 10%;">ID</th>
                            <th scope="col" style="width: 30%;">NAME</th>
                            <th scope="col" style="width: 15%;">AGE</th>
                            <th scope="col" style="width: 25%;">SALARY</th>
                            <th scope="col" class="text-end pe-4" style="width: 20%;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td class="ps-4 fw-bold text-secondary" th:text="${u.id}">1</td>
                            <td class="fw-semibold" th:text="${u.name}">John Doe</td>
                            <td th:text="${u.age}">30</td>
                            <td class="text-success fw-bold" th:text="${#numbers.formatDecimal(u.salary, 1, 'COMMA', 2, 'POINT')}">50,000.00</td>
                            <td class="text-end pe-4">
                                <a th:href="@{'/users/edit/' + ${u.id}}" class="btn btn-success btn-sm me-1 px-3">
                                    <i class="fa-solid fa-pen-to-square me-1"></i>Edit
                                </a>
                                <a th:href="@{'/users/delete/' + ${u.id}}" 
                                   class="btn btn-danger btn-sm px-3" 
                                   onclick="return confirm('Are you sure you want to remove this user?');">
                                    <i class="fa-solid fa-trash me-1"></i>Remove
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="5" class="text-center py-4 text-muted">
                                <i class="fa-solid fa-inbox fa-2x mb-2 d-block"></i>
                                No users found in the system.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle CDN -->
<script href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- jQuery 3.6.0 CDN -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- jQuery Reset Form Logic -->
<script>
    $(document).ready(function() {
        $('#btnReset').on('click', function() {
            // Reset input values
            $('#userId').val('');
            $('#name').val('');
            $('#age').val('');
            $('#salary').val('');

            // Reset form action and button text
            $('#userForm').attr('action', '/users/save');
            $('#btnSubmit').text('Add');
            $('#formTitle').text('User');

            // Hide alert messages if present
            $('#alertArea').slideUp(200, function() {
                $(this).empty().show();
            });
        });
    });
</script>

</body>
</html>
